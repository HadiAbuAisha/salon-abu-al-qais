name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.*'
      - 'index.html'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: https://crwmeepwzaoqhafvwkej.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_uBezuk6ILeTpu0ACE-mi_g_wScvJeUp
      VITE_VAPID_PUBLIC_KEY: BBeui_BFmdNRMxzYcqrrnQxo3LP1ts5rc3YZ6brELVVG_glB78Ggj412oYFkQeJ3k7_QiiyxOIPul1BxcyHeexQ

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install icon renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor Android tools
        run: npm install --no-save @capacitor/android @capacitor/cli

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Apply BARBERIA launcher icon
        run: |
          rsvg-convert public/barber-logo.svg -w 512 -h 512 -o /tmp/barber-icon.png
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          find android/app/src/main/res -type f \( -name 'ic_launcher.webp' -o -name 'ic_launcher_round.webp' -o -name 'ic_launcher.png' -o -name 'ic_launcher_round.png' \) -delete
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$d
            cp /tmp/barber-icon.png android/app/src/main/res/$d/ic_launcher.png
            cp /tmp/barber-icon.png android/app/src/main/res/$d/ic_launcher_round.png
          done

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk salon-abu-al-qais.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salon-abu-al-qais-apk
          path: salon-abu-al-qais.apk
          retention-days: 30
